[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-eagle-eye-mcp"
version = "0.3.0"
description = "MCP + dashboard service for market narratives across Polymarket, Polygon, and squawk feeds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
market-eagle-eye-mcp = "polymarket_mcp.server:run"
polymarket-mcp = "polymarket_mcp.server:run"
market-eagle-eye-dashboard = "polymarket_mcp.dashboard:run"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_mcp"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
