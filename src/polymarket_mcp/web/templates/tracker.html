<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Tracker - Polymarket MCP</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: var(--bg-secondary, #1e293b);
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid var(--border-color, #334155);
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-color, #3b82f6);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .metric-label {
            font-size: 0.875rem;
            color: var(--text-muted, #94a3b8);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary, #f1f5f9);
            margin-bottom: 0.5rem;
        }

        .metric-change {
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .metric-change.positive {
            color: #10b981;
        }

        .metric-change.negative {
            color: #ef4444;
        }

        .category-section {
            margin-bottom: 2rem;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-color, #334155);
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary, #f1f5f9);
        }

        .markets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1rem;
        }

        .market-card {
            background: var(--bg-secondary, #1e293b);
            border-radius: 8px;
            padding: 1.25rem;
            border: 1px solid var(--border-color, #334155);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .market-card:hover {
            border-color: var(--primary-color, #3b82f6);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
        }

        .market-question {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary, #f1f5f9);
            margin-bottom: 0.75rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .market-prices {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .price-badge {
            flex: 1;
            padding: 0.5rem;
            border-radius: 6px;
            text-align: center;
        }

        .price-badge.yes {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .price-badge.no {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .price-label {
            font-size: 0.75rem;
            color: var(--text-muted, #94a3b8);
            margin-bottom: 0.25rem;
        }

        .price-value {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .price-badge.yes .price-value {
            color: #10b981;
        }

        .price-badge.no .price-value {
            color: #ef4444;
        }

        .market-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .market-stat {
            text-align: center;
            padding: 0.5rem;
            background: var(--bg-primary, #0f172a);
            border-radius: 4px;
        }

        .market-stat-label {
            color: var(--text-muted, #94a3b8);
            font-size: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .market-stat-value {
            color: var(--text-primary, #f1f5f9);
            font-weight: 600;
        }

        .refresh-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted, #94a3b8);
            font-size: 0.875rem;
        }

        .refresh-indicator.active {
            color: var(--primary-color, #3b82f6);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .refresh-indicator.active svg {
            animation: spin 1s linear infinite;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted, #94a3b8);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary, #1e293b);
            border: 1px solid var(--border-color, #334155);
            border-radius: 6px;
            color: var(--text-primary, #f1f5f9);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .filter-tab:hover {
            border-color: var(--primary-color, #3b82f6);
            background: rgba(59, 130, 246, 0.1);
        }

        .filter-tab.active {
            background: var(--primary-color, #3b82f6);
            border-color: var(--primary-color, #3b82f6);
            color: white;
        }

        .loading-skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 4px;
            height: 1rem;
            margin-bottom: 0.5rem;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>Polymarket MCP</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/tracker" class="active">Market Tracker</a></li>
                <li><a href="/markets">Markets</a></li>
                <li><a href="/config">Configuration</a></li>
                <li><a href="/monitoring">Monitoring</a></li>
            </ul>
        </div>
    </nav>

    <main class="container main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Market Tracker</h1>
            <div class="refresh-indicator" id="refresh-indicator">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
                <span id="refresh-text">Auto-refresh in <span id="refresh-countdown">30</span>s</span>
            </div>
        </div>

        <!-- Key Metrics -->
        <section class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Total Markets</div>
                <div class="metric-value" id="metric-total-markets">-</div>
                <div class="metric-change" id="metric-total-markets-change"></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">24h Volume</div>
                <div class="metric-value" id="metric-total-volume">-</div>
                <div class="metric-change positive" id="metric-volume-change"></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Total Liquidity</div>
                <div class="metric-value" id="metric-total-liquidity">-</div>
                <div class="metric-change" id="metric-liquidity-change"></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Avg Spread</div>
                <div class="metric-value" id="metric-avg-spread">-</div>
                <div class="metric-change" id="metric-spread-change"></div>
            </div>
        </section>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="switchCategory('trending')" data-category="trending">Trending</button>
            <button class="filter-tab" onclick="switchCategory('politics')" data-category="politics">Politics</button>
            <button class="filter-tab" onclick="switchCategory('sports')" data-category="sports">Sports</button>
            <button class="filter-tab" onclick="switchCategory('crypto')" data-category="crypto">Crypto</button>
            <button class="filter-tab" onclick="switchCategory('closing')" data-category="closing">Closing Soon</button>
        </div>

        <!-- Trending Markets -->
        <section class="category-section">
            <div class="category-header">
                <h2 class="category-title" id="category-title">Trending Markets</h2>
                <button class="btn btn-sm" onclick="refreshCurrentCategory()">Refresh</button>
            </div>
            <div class="markets-grid" id="markets-container">
                <!-- Markets will be loaded here -->
                <div class="empty-state">
                    <div class="empty-state-icon">📊</div>
                    <p>Loading markets...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Polymarket MCP Dashboard</p>
        </div>
    </footer>

    <script src="/static/js/app.js"></script>
    <script>
        let currentCategory = 'trending';
        let allMarkets = [];
        let refreshTimer = 30;
        let refreshInterval = null;
        let countdownInterval = null;

        // Initialize on load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCategory('trending');
            startAutoRefresh();
        });

        async function loadCategory(category) {
            currentCategory = category;
            const container = document.getElementById('markets-container');
            const indicator = document.getElementById('refresh-indicator');

            // Update UI
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.category === category);
            });

            // Show loading state
            indicator.classList.add('active');
            container.innerHTML = generateLoadingSkeletons(6);

            try {
                let endpoint = '';
                let title = '';

                switch(category) {
                    case 'trending':
                        endpoint = '/api/tracker/trending';
                        title = 'Trending Markets';
                        break;
                    case 'politics':
                        endpoint = '/api/tracker/politics';
                        title = 'Politics Markets';
                        break;
                    case 'sports':
                        endpoint = '/api/tracker/sports';
                        title = 'Sports Markets';
                        break;
                    case 'crypto':
                        endpoint = '/api/tracker/crypto';
                        title = 'Crypto Markets';
                        break;
                    case 'closing':
                        endpoint = '/api/tracker/closing-soon';
                        title = 'Markets Closing Soon';
                        break;
                }

                document.getElementById('category-title').textContent = title;

                const response = await fetch(endpoint);
                const data = await response.json();

                if (data.markets && data.markets.length > 0) {
                    allMarkets = data.markets;
                    displayMarkets(data.markets);
                    updateMetrics(data.markets);
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <p>No markets found in this category</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Failed to load markets:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Failed to load markets: ${error.message}</p>
                        <button class="btn btn-primary" onclick="loadCategory('${category}')">Retry</button>
                    </div>
                `;
            } finally {
                indicator.classList.remove('active');
            }
        }

        function displayMarkets(markets) {
            const container = document.getElementById('markets-container');

            if (!markets || markets.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No markets available</p>
                    </div>
                `;
                return;
            }

            const html = markets.map(market => `
                <div class="market-card" onclick="viewMarketDetails('${market.condition_id || market.id}')">
                    <div class="market-question">${escapeHtml(market.question || 'Unknown Market')}</div>

                    <div class="market-prices">
                        <div class="price-badge yes">
                            <div class="price-label">YES</div>
                            <div class="price-value">${formatPrice(market.price_yes || market.yes_price || 0)}</div>
                        </div>
                        <div class="price-badge no">
                            <div class="price-label">NO</div>
                            <div class="price-value">${formatPrice(market.price_no || market.no_price || 0)}</div>
                        </div>
                    </div>

                    <div class="market-stats">
                        <div class="market-stat">
                            <div class="market-stat-label">Volume 24h</div>
                            <div class="market-stat-value">${formatCompactCurrency(market.volume_24h || market.volume || 0)}</div>
                        </div>
                        <div class="market-stat">
                            <div class="market-stat-label">Liquidity</div>
                            <div class="market-stat-value">${formatCompactCurrency(market.liquidity || 0)}</div>
                        </div>
                        <div class="market-stat">
                            <div class="market-stat-label">Spread</div>
                            <div class="market-stat-value">${formatPercent(market.spread || 0)}</div>
                        </div>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        function updateMetrics(markets) {
            if (!markets || markets.length === 0) return;

            // Calculate metrics
            const totalMarkets = markets.length;
            const totalVolume = markets.reduce((sum, m) => sum + (m.volume_24h || m.volume || 0), 0);
            const totalLiquidity = markets.reduce((sum, m) => sum + (m.liquidity || 0), 0);
            const avgSpread = markets.reduce((sum, m) => sum + (m.spread || 0), 0) / markets.length;

            // Update UI
            document.getElementById('metric-total-markets').textContent = formatNumber(totalMarkets);
            document.getElementById('metric-total-volume').textContent = formatCompactCurrency(totalVolume);
            document.getElementById('metric-total-liquidity').textContent = formatCompactCurrency(totalLiquidity);
            document.getElementById('metric-avg-spread').textContent = formatPercent(avgSpread);
        }

        function generateLoadingSkeletons(count) {
            return Array(count).fill(0).map(() => `
                <div class="market-card">
                    <div class="loading-skeleton" style="height: 2.5rem; margin-bottom: 1rem;"></div>
                    <div class="loading-skeleton" style="height: 4rem; margin-bottom: 0.75rem;"></div>
                    <div class="loading-skeleton" style="height: 3rem;"></div>
                </div>
            `).join('');
        }

        function switchCategory(category) {
            loadCategory(category);
            resetRefreshTimer();
        }

        function refreshCurrentCategory() {
            loadCategory(currentCategory);
            resetRefreshTimer();
        }

        function startAutoRefresh() {
            // Clear existing intervals
            if (refreshInterval) clearInterval(refreshInterval);
            if (countdownInterval) clearInterval(countdownInterval);

            // Start countdown
            refreshTimer = 30;
            countdownInterval = setInterval(() => {
                refreshTimer--;
                document.getElementById('refresh-countdown').textContent = refreshTimer;

                if (refreshTimer <= 0) {
                    refreshCurrentCategory();
                }
            }, 1000);

            // Auto-refresh every 30 seconds
            refreshInterval = setInterval(() => {
                refreshCurrentCategory();
            }, 30000);
        }

        function resetRefreshTimer() {
            refreshTimer = 30;
            document.getElementById('refresh-countdown').textContent = refreshTimer;
        }

        function viewMarketDetails(marketId) {
            window.location.href = `/markets?id=${marketId}`;
        }

        function formatCompactCurrency(value) {
            // Convert to number and handle invalid values
            const num = parseFloat(value);
            if (isNaN(num) || num === 0) return '$0';

            if (num >= 1000000) {
                return '$' + (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return '$' + (num / 1000).toFixed(1) + 'K';
            } else {
                return '$' + num.toFixed(0);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
            if (countdownInterval) clearInterval(countdownInterval);
        });
    </script>
</body>
</html>
